name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build-only

      # Bundle-size guard. Fails the build if the gzipped JS or CSS output
      # grows past the threshold — catches accidental dep bloat in review
      # before it ships. Thresholds sit ~25-50% above the current sizes:
      # real feature work has headroom, but adding moment.js or lodash-all
      # trips the wire. Update the numbers (in the same commit as the
      # change that needs them) rather than raising them silently.
      - name: Bundle size check
        run: |
          set -euo pipefail
          JS_LIMIT=45000   # bytes, gzipped (current ~33 KB)
          CSS_LIMIT=5000   # bytes, gzipped (current ~2.7 KB)

          js_size=$(find dist/assets -name '*.js'  -exec gzip -c {} \; | wc -c)
          css_size=$(find dist/assets -name '*.css' -exec gzip -c {} \; | wc -c)

          printf 'JS  gzip: %s bytes (limit %s)\n'  "$js_size"  "$JS_LIMIT"
          printf 'CSS gzip: %s bytes (limit %s)\n'  "$css_size" "$CSS_LIMIT"

          fail=0
          if [ "$js_size"  -gt "$JS_LIMIT"  ]; then echo "::error::JS bundle exceeds gzip limit";  fail=1; fi
          if [ "$css_size" -gt "$CSS_LIMIT" ]; then echo "::error::CSS bundle exceeds gzip limit"; fail=1; fi
          exit $fail

  # E2E runs in a separate job so the two suites are parallel wall-clock
  # and a flaky E2E doesn't mask a fast unit/lint failure. Uses the official
  # Cypress action for free binary caching + build/start/wait orchestration.
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Run Cypress
        uses: cypress-io/github-action@v6
        with:
          build: npm run build-only
          start: npm run preview
          wait-on: 'http://localhost:4173'
          wait-on-timeout: 60
